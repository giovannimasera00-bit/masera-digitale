<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Shop, scheda prodotto</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E3F2D}a:hover{color:#425D3A}
.serif{font-family:'Bodoni Moda',Georgia,serif;font-style:italic;font-weight:700;font-variation-settings:'opsz' 14}
@keyframes prFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(1deg)}}
@keyframes prGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes prDot{0%{box-shadow:0 0 0 0 rgba(163,190,25,.6)}100%{box-shadow:0 0 0 8px rgba(163,190,25,0)}}
.pr-float{animation:prFloat 6s ease-in-out infinite}
.pr-line{transform-origin:top;transform:scaleY(0);animation:prGrow 1.6s cubic-bezier(.2,.8,.2,1) .4s forwards}
.pr-now{animation:prDot 1.6s ease-out infinite}
@keyframes prSwap{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.pr-swap{animation:prSwap .45s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){.pr-float,.pr-now{animation:none}.pr-line{animation:none;transform:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F4EE; font-family: 'DM Sans', Arial, sans-serif; color: #1D1D1B; overflow: hidden; position: relative">
<div style="height: 330px; position: relative; background: radial-gradient(90% 100% at 50% 100%, #DCE7E2 0%, #F6F4EE 70%); display: flex; align-items: flex-end; justify-content: center">
<a href="HomeMobile.dc.html" aria-label="Indietro" style="position: absolute; top: 54px; left: 20px; width: 44px; height: 44px; border-radius: 50%; background: #fff; border: 1px solid #E2DED2; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2E3F2D" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<svg viewBox="0 0 390 330" aria-hidden="true" style="position: absolute; inset: 0"><g fill="none" stroke="#9AB9AD" stroke-opacity=".45" stroke-width="1.5"><path d="M55 330V200a140 140 0 0 1 280 0V330"></path><path d="M95 330V210a100 100 0 0 1 200 0V330"></path></g></svg>
<div class="pr-float" style="position: relative; width: 120px; height: 220px; margin-bottom: 34px; border-radius: 22px 22px 16px 16px; background: #fff; border: 1px solid #E2DED2; box-shadow: 0 24px 40px rgba(31,43,30,.18); display: flex; align-items: center; justify-content: center; text-align: center; font-size: 12px; color: #5a5a55; padding: 10px; box-sizing: border-box">[foto prodotto]</div>
</div>

<div style="padding: 18px 20px 0">
<p style="margin: 0 0 6px; font-size: 12px; letter-spacing: .18em; font-weight: 700; color: #425D3A">LINEA DOTTOR MASERA</p>
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
<h1 class="serif" style="margin: 0; font-size: 30px; line-height: 1.05; color: #2E3F2D">[Nome prodotto]</h1>
<b style="font-size: 22px; color: #2E3F2D; white-space: nowrap">[prezzo]</b>
</div>
<p style="margin: 8px 0 16px; font-size: 15px; line-height: 1.5; color: #4a4a46">[Una riga su a cosa serve e per chi è]</p>

<div style="background: #fff; border: 1px solid #E8E4D8; border-radius: 20px; padding: 16px 18px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px">
<p style="margin: 0; font-size: 12px; letter-spacing: .16em; font-weight: 700; color: #425D3A">CONSEGNA A</p>
<div role="tablist" aria-label="Dove consegnare" style="display: flex; gap: 4px; background: #EFECE4; border-radius: 999px; padding: 3px">
<button type="button" role="tab" aria-selected="{{selA}}" onClick="{{pickA}}" style="border: 0; border-radius: 999px; padding: 8px 12px; min-height: 40px; font-family: inherit; font-weight: 700; font-size: 13px; background: {{bgA}}; color: {{fgA}}; cursor: pointer">Seregno</button>
<button type="button" role="tab" aria-selected="{{selB}}" onClick="{{pickB}}" style="border: 0; border-radius: 999px; padding: 8px 12px; min-height: 40px; font-family: inherit; font-weight: 700; font-size: 13px; background: {{bgB}}; color: {{fgB}}; cursor: pointer">Resto d'Italia</button>
</div>
</div>
<sc-for list="{{flows}}" as="f" hint-placeholder-count="1">
<sc-if value="{{f.on}}" hint-placeholder-val="{{ true }}">
<div class="pr-swap" style="position: relative; display: flex; flex-direction: column; gap: 14px; padding-left: 26px">
<span class="pr-line" style="position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: linear-gradient(#A3BE19, #9AB9AD)"></span>
<sc-for list="{{f.steps}}" as="s" hint-placeholder-count="3">
<div style="position: relative"><span class="{{s.cls}}" style="position: absolute; left: -25px; top: 3px; width: 12px; height: 12px; border-radius: 50%; background: {{s.dot}}; border: 2px solid {{s.ring}}; box-sizing: border-box"></span><b style="font-size: 14px">{{s.t}}</b><span style="display: block; font-size: 13px; color: #5a5a55">{{s.d}}</span></div>
</sc-for>
</div>
</sc-if>
</sc-for>
</div>

<a href="#chiedi" style="margin-top: 12px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #1D1D1B; background: #E6EDCB; border-radius: 18px; padding: 12px 16px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2E3F2D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>
<span style="font-size: 14px"><b>Non sai se fa per te?</b> Chiedi al farmacista</span>
</a>
</div>

<div style="position: absolute; left: 16px; right: 16px; bottom: 22px; display: flex; gap: 10px">
<div style="display: flex; align-items: center; background: #fff; border: 1px solid #E2DED2; border-radius: 999px; padding: 0 6px">
<button type="button" aria-label="Togli uno" style="width: 44px; height: 52px; border: 0; background: transparent; font-size: 22px; color: #2E3F2D; font-family: inherit">−</button>
<b style="width: 20px; text-align: center">1</b>
<button type="button" aria-label="Aggiungi uno" style="width: 44px; height: 52px; border: 0; background: transparent; font-size: 22px; color: #2E3F2D; font-family: inherit">+</button>
</div>
<button type="button" style="flex: 1; border: 0; border-radius: 999px; background: #2E3F2D; color: #fff; font-family: inherit; font-weight: 700; font-size: 16px; min-height: 56px">{{ctaLabel}}</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { italia: false }; }
  renderVals() {
    const it = this.state.italia;
    const now = { dot: '#A3BE19', ring: '#A3BE19', cls: 'pr-now' };
    const next = (c) => ({ dot: '#fff', ring: c, cls: '' });
    const flows = [
      { on: !it, steps: [
        { t: 'Entro le 16:00', d: 'L’ordine entra nel giro di oggi', ...now },
        { t: 'Preparato in farmacia', d: 'Il pacco viene sigillato da un farmacista', ...next('#9AB9AD') },
        { t: 'Verso le 19:00 a casa tua', d: 'Consegna sempre gratuita, paghi alla consegna', ...next('#B7A999') }
      ] },
      { on: it, steps: [
        { t: 'Oggi lo prepariamo', d: 'Imballato in farmacia e affidato al corriere', ...now },
        { t: 'In viaggio', d: 'Ti mandiamo il link per seguirlo', ...next('#9AB9AD') },
        { t: 'A casa in 2–3 giorni lavorativi', d: 'Spedizione gratuita sopra i 59 €', ...next('#B7A999') }
      ] }
    ];
    return {
      flows,
      selA: it ? 'false' : 'true', selB: it ? 'true' : 'false',
      bgA: it ? 'transparent' : '#2E3F2D', fgA: it ? '#2E3F2D' : '#fff',
      bgB: it ? '#2E3F2D' : 'transparent', fgB: it ? '#fff' : '#2E3F2D',
      pickA: () => this.setState({ italia: false }), pickB: () => this.setState({ italia: true }),
      ctaLabel: it ? 'Aggiungi al carrello' : 'Aggiungi · arriva oggi'
    };
  }
}
</script>
</body>
</html>
