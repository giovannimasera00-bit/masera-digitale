<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>SkinLab Routine</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E3F2D}a:hover{color:#425D3A}
button{font-family:inherit;cursor:pointer}
.serif{font-family:'Bodoni Moda',Georgia,serif;font-style:italic;font-weight:700;font-variation-settings:'opsz' 14}
.sk-step{transition:background .35s,border-color .35s,opacity .35s,transform .25s}
.sk-step:active{transform:scale(.98)}
.sk-box{transition:background .3s,border-color .3s,transform .4s cubic-bezier(.3,1.6,.5,1)}
.sk-fill{transition:width .7s cubic-bezier(.2,.8,.2,1)}
.sk-sky{transition:background 1s ease}
@keyframes skIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes skSun{from{transform:translateY(20px) scale(.8);opacity:0}to{transform:none;opacity:1}}
.sk-in{animation:skIn .45s cubic-bezier(.2,.8,.2,1) both}
.sk-sun{animation:skSun .8s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){.sk-in,.sk-sun{animation:none}.sk-step,.sk-box,.sk-fill,.sk-sky{transition:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F4EE; font-family: 'DM Sans', Arial, sans-serif; color: #1D1D1B; overflow: hidden; position: relative">
<div class="sk-sky" style="padding: 56px 20px 26px; background: {{sky}}; color: {{skyFg}}; border-radius: 0 0 32px 32px">
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px">
<p style="margin: 0; display: flex; align-items: baseline; gap: 2px; color: #fff; line-height: 1"><span class="serif" style="font-size: 30px">Skin</span><span style="font-size: 26px; font-weight: 400; letter-spacing: .06em">LAB</span><span style="margin-left: 10px; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: {{kicker}}">BY FARMACIA MASERA</span></p>
<a href="HomeMobile.dc.html" aria-label="Torna alla home" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{skyFg}}" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 12px">
<div>
<h1 class="serif" style="margin: 0; font-size: 38px; line-height: 1">{{title}}</h1>
<p style="margin: 8px 0 0; font-size: 14px; opacity: .85">Consigliata al banco da [farmacista], [data]</p>
</div>
<svg class="sk-sun" width="58" height="58" viewBox="0 0 58 58" aria-hidden="true"><circle cx="29" cy="29" r="{{orbR}}" fill="{{orb}}"></circle><circle cx="{{moonCut}}" cy="22" r="15" fill="{{sky2}}"></circle></svg>
</div>
<div role="tablist" aria-label="Momento della giornata" style="margin-top: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: rgba(255,255,255,.2); border-radius: 999px; padding: 4px">
<button type="button" role="tab" aria-selected="{{amSel}}" onClick="{{setAm}}" style="border: 0; border-radius: 999px; padding: 11px 0; font-weight: 700; font-size: 14px; background: {{amBg}}; color: {{amFg}}; min-height: 44px">Mattina</button>
<button type="button" role="tab" aria-selected="{{pmSel}}" onClick="{{setPm}}" style="border: 0; border-radius: 999px; padding: 11px 0; font-weight: 700; font-size: 14px; background: {{pmBg}}; color: {{pmFg}}; min-height: 44px">Sera</button>
</div>
</div>

<div style="padding: 18px 20px 0">
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 14px"><b>{{progressText}}</b><span style="color: #5a5a55">{{doneCount}} di {{total}}</span></div>
<div style="height: 8px; border-radius: 4px; background: #E2DED2; overflow: hidden; margin-bottom: 16px"><div class="sk-fill" style="height: 100%; border-radius: 4px; background: linear-gradient(90deg, #B7A999, #5e5448); width: {{pct}}"></div></div>

<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
<button class="sk-step sk-in" type="button" onClick="{{s.toggle}}" aria-pressed="{{s.pressed}}" style="text-align: left; border: 1.5px solid {{s.border}}; background: {{s.bg}}; border-radius: 20px; padding: 14px 16px; display: flex; gap: 14px; align-items: center; color: #1D1D1B; animation-delay: {{s.delay}}">
<span class="sk-box" style="flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid {{s.boxBorder}}; background: {{s.boxBg}}; display: flex; align-items: center; justify-content: center; transform: {{s.boxScale}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{s.checkColor}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
<span style="flex: 1; min-width: 0"><span style="display: block; font-size: 11px; letter-spacing: .14em; font-weight: 700; color: #6E6153">{{s.n}} · {{s.kind}}</span><b style="display: block; font-size: 16px; text-decoration: {{s.strike}}">{{s.product}}</b><span style="font-size: 13px; color: #5a5a55">{{s.how}}</span></span>
</button>
</sc-for>
</div>

<sc-if value="{{allDone}}" hint-placeholder-val="{{ false }}">
<div class="sk-in" style="margin-top: 14px; background: #5e5448; color: #fff; border-radius: 20px; padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px">
<b class="serif" style="font-size: 22px">{{doneMsg}}</b>
<a href="Prodotto.dc.html" style="color: #C9DB6A; font-weight: 700; font-size: 14px; text-decoration: none; white-space: nowrap">Riordina →</a>
</div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { pm: false, done: { am: [true], pm: [] } }; }
  renderVals() {
    const st = this.state;
    const key = st.pm ? 'pm' : 'am';
    const routines = {
      am: [
        { kind: 'Detergere', product: '[Detergente viso]', how: '1 pressione, massaggia 30 secondi' },
        { kind: 'Trattare', product: '[Siero]', how: '3 gocce su viso e collo' },
        { kind: 'Idratare', product: '[Crema giorno]', how: 'quanto un chicco di riso' },
        { kind: 'Proteggere', product: '[Protezione solare]', how: 'due dita, ultimo passaggio' }
      ],
      pm: [
        { kind: 'Struccare', product: '[Struccante]', how: 'un dischetto per lato' },
        { kind: 'Detergere', product: '[Detergente viso]', how: '1 pressione' },
        { kind: 'Trattare', product: '[Trattamento notte]', how: 'a sere alterne, per iniziare' },
        { kind: 'Nutrire', product: '[Crema notte]', how: 'quanto un pisello' }
      ]
    };
    const doneList = st.done[key];
    const list = routines[key];
    const steps = list.map((s, i) => {
      const on = doneList.indexOf(i) >= 0;
      return {
        ...s, n: String(i + 1).padStart(2, '0'), delay: (i * 0.06) + 's', pressed: on ? 'true' : 'false',
        bg: on ? '#EFEAE2' : '#fff', border: on ? '#8C7D6C' : '#E8E4D8',
        boxBg: on ? '#8C7D6C' : '#fff', boxBorder: on ? '#8C7D6C' : '#C9C4B5', checkColor: on ? '#fff' : 'transparent',
        boxScale: on ? 'scale(1.08)' : 'scale(1)', strike: on ? 'line-through' : 'none',
        toggle: () => {
          const cur = st.done[key];
          const next = on ? cur.filter((x) => x !== i) : cur.concat([i]);
          this.setState({ done: { ...st.done, [key]: next } });
        }
      };
    });
    const doneCount = doneList.length, total = list.length;
    const pm = st.pm;
    return {
      steps, doneCount, total,
      pct: Math.round(100 * doneCount / total) + '%',
      allDone: doneCount === total,
      progressText: doneCount === total ? 'Routine completata' : (doneCount === 0 ? 'Iniziamo' : 'Ci sei quasi'),
      doneMsg: pm ? 'Buonanotte, pelle.' : 'Pronta per la giornata.',
      title: pm ? 'Routine della sera' : 'Routine del mattino',
      sky: pm ? 'linear-gradient(160deg, #3a332b 0%, #5e5448 100%)' : 'linear-gradient(160deg, #C4B8A9 0%, #A8998A 100%)',
      sky2: pm ? '#463e35' : '#B5A898',
      skyFg: pm ? '#fff' : '#1D1D1B', kicker: pm ? '#D6D2C4' : '#3a332b',
      orb: pm ? '#F4F1E8' : '#F4F1E8', orbR: pm ? 18 : 20, moonCut: pm ? 37 : 90,
      amSel: pm ? 'false' : 'true', pmSel: pm ? 'true' : 'false',
      amBg: pm ? 'transparent' : '#fff', amFg: pm ? '#D6D2C4' : '#2E3F2D',
      pmBg: pm ? '#fff' : 'transparent', pmFg: pm ? '#2E3F2D' : '#2E3F2D',
      setAm: () => this.setState({ pm: false }), setPm: () => this.setState({ pm: true })
    };
  }
}
</script>
</body>
</html>
